      value_type = "int"

    [[params.headless_cms.collections.fields]]
      label = "Date"
      name = "date"
      widget = "datetime"

    [[params.headless_cms.collections.fields]]
      label = "Draft"
      name = "draft"
      widget = "boolean"
      default = false

    [[params.headless_cms.collections.fields]]
      label = "Tags"
      name = "tags"
      widget = "list"
      required = false

    [[params.headless_cms.collections.fields]]
      label = "Categories"
      name = "categories"
      widget = "list"
      required = false

    [[params.headless_cms.collections.fields]]
      label = "Technologies"
      name = "technologies"
      widget = "list"
      required = false

    [[params.headless_cms.collections.fields]]
      label = "Status"
      name = "status"
      widget = "select"
      options = ["completed", "planned", "in-progress"]
      default = "planned"

    [[params.headless_cms.collections.fields]]
      label = "Featured"
      name = "featured"
      widget = "boolean"
      default = false
      required = false

    [[params.headless_cms.collections.fields]]
      label = "Description"

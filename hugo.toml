baseURL = "https://example.org/"
languageCode = "en-us"
title = "Hugo Collections Demo"
disableKinds = ["taxonomy", "term"]

# Pagination settings (Hugo v0.128.0+ format)
[pagination]
  pagerSize = 5
  path = "page"

# Number of items per page (required for pagination)
paginate = 10

[module]
  [[module.imports]]
    path = "github.com/privatemaker/headless-cms"

[outputs]
  home = ["HTML", "RSS", "HeadlessCMSConfig"]

[params.headless_cms]
  engine = "sveltia"
  site_url = "https://your-site.org"

  [params.headless_cms.backend]
    name = "github"
    repo = "managedkaos/hugo-collections-demo"

  # Blog collection
  [[params.headless_cms.collections]]
    name = "blog"
    label = "Blog Posts"
    folder = "content/blog"
    create = true

    [[params.headless_cms.collections.fields]]
      label = "Title"
      name = "title"
      widget = "string"

    [[params.headless_cms.collections.fields]]
      label = "Date"
      name = "date"
      widget = "datetime"

    [[params.headless_cms.collections.fields]]
      label = "Draft"
      name = "draft"
      widget = "boolean"
      default = false

    [[params.headless_cms.collections.fields]]
      label = "Tags"
      name = "tags"
      widget = "list"
      required = false

    [[params.headless_cms.collections.fields]]
      label = "Categories"
      name = "categories"
      widget = "list"
      required = false

    [[params.headless_cms.collections.fields]]
      label = "Authors"
      name = "authors"
      widget = "list"
      required = false

    [[params.headless_cms.collections.fields]]
      label = "Description"
      name = "description"
      widget = "text"

    [[params.headless_cms.collections.fields]]
      label = "Featured"
      name = "featured"
      widget = "boolean"
      default = false
      required = false

    [[params.headless_cms.collections.fields]]
      label = "Body"
      name = "body"
      widget = "markdown"

  # Episodes collection
  [[params.headless_cms.collections]]
    name = "episodes"
    label = "Episodes"
    folder = "content/episodes"
    create = true

    [[params.headless_cms.collections.fields]]
